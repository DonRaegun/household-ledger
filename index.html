<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>가계부</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="prev" aria-label="이전">‹</button>
  <h1 id="month"></h1>
  <button id="next" aria-label="다음">›</button>
</header>

<main>
  <section id="summary">
    <div><span>수입</span><b id="sum-in" class="in"></b></div>
    <div><span>지출</span><b id="sum-out" class="out"></b></div>
    <div><span>합계</span><b id="sum-bal"></b></div>
  </section>
  <div id="banner" hidden></div>
  <div id="upcoming" hidden></div>
  <div id="card-info" hidden></div>

  <section id="view-list">
    <div class="toggle" id="list-mode">
      <button data-lmode="list" class="active">목록</button>
      <button data-lmode="cal">달력</button>
    </div>
    <div id="list-wrap">
      <ul id="list"></ul>
      <p id="empty" hidden>내역이 없어요. 아래 + 버튼으로 추가하세요.</p>
    </div>
    <div id="view-cal" hidden>
      <div id="cal-head"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div id="cal-grid"></div>
      <ul id="cal-list"></ul>
    </div>
  </section>

  <section id="view-stats" hidden>
    <div class="toggle" id="stats-mode">
      <button data-mode="month" class="active">월별</button>
      <button data-mode="year">연별</button>
    </div>
    <div id="year-wrap" hidden>
      <h2>월별 지출</h2>
      <div id="year-bars"></div>
    </div>
    <h2>카테고리별 지출</h2>
    <div id="donut-wrap">
      <svg id="donut" viewBox="0 0 100 100" role="img" aria-label="카테고리별 지출 비율"></svg>
      <div id="donut-center"><span id="donut-label">총 지출</span><b id="donut-total"></b><small id="donut-pct"></small></div>
    </div>
    <ul id="stats"></ul>
    <div id="pay-wrap" hidden>
      <h2>결제수단별 지출</h2>
      <ul id="pay-stats"></ul>
    </div>
  </section>

  <section id="view-settings" hidden>
    <h2>카드 결제일</h2>
    <div class="panel">
      <label class="field">결제일 <select id="card-day"></select></label>
      <label class="field">사용 기간 시작일 <select id="card-start"></select></label>
      <p class="hint" id="card-hint"></p>
    </div>

    <h2 id="fixed-title">고정지출</h2>
    <ul id="fixed-list"></ul>
    <button id="fixed-add" class="wide">+ 고정지출 추가</button>
    <p class="hint">정해진 날짜가 되면 앱을 열 때 자동으로 내역에 추가돼요. 날짜 전에는 내역 탭에 "예정"으로 표시되고, 통계에는 날짜가 된 뒤부터 들어가요.</p>

    <h2>데이터 관리</h2>
    <div class="row">
      <button id="export-csv">CSV 내보내기</button>
      <button id="export-json">백업(JSON)</button>
      <button id="import-json">백업 불러오기</button>
      <input type="file" id="import-file" accept="application/json" hidden>
    </div>
  </section>
</main>

<nav>
  <button data-tab="list" class="active">내역</button>
  <button data-tab="stats">통계</button>
  <button data-tab="settings">설정</button>
</nav>
<button id="fab" aria-label="추가">+</button>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlg-title">내역 추가</h2>
    <div class="seg">
      <label><input type="radio" name="type" value="out" checked><span>지출</span></label>
      <label><input type="radio" name="type" value="in"><span>수입</span></label>
    </div>
    <input id="amount" type="text" inputmode="numeric" placeholder="금액" required autocomplete="off">
    <select id="category"></select>
    <div class="seg" id="pay-seg">
      <label><input type="radio" name="pay" value="cash"><span>현금</span></label>
      <label><input type="radio" name="pay" value="card"><span>카드</span></label>
      <label><input type="radio" name="pay" value="transfer"><span>계좌이체</span></label>
    </div>
    <input id="date" type="date" required>
    <input id="memo" type="text" placeholder="메모 (선택)" autocomplete="off">
    <div class="row">
      <button type="button" id="del" class="danger" hidden>삭제</button>
      <button type="button" id="cancel">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<dialog id="fdlg">
  <form id="fform" method="dialog">
    <h2 id="fdlg-title">고정지출 추가</h2>
    <input id="fname" type="text" placeholder="이름 (예: 월세, 넷플릭스)" required autocomplete="off">
    <input id="famount" type="text" inputmode="numeric" placeholder="금액" required autocomplete="off">
    <select id="fcategory"></select>
    <div class="seg">
      <label><input type="radio" name="fpay" value="cash"><span>현금</span></label>
      <label><input type="radio" name="fpay" value="card" checked><span>카드</span></label>
      <label><input type="radio" name="fpay" value="transfer"><span>계좌이체</span></label>
    </div>
    <label class="field">매달 <select id="fday"></select> 일</label>
    <div class="row">
      <button type="button" id="fdel" class="danger" hidden>삭제</button>
      <button type="button" id="fcancel">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
